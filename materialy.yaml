# ================================================================
#  MATERIAŁY DLA UCZESTNIKÓW
#  Ten plik zasila zakładkę /materialy. Pliki do pobrania leżą w folderze
#  materialy/<id grupy>/ (np. materialy/mentoring/kontrakt.pdf).
# ================================================================
#
#  Każda grupa (np. jedno szkolenie) ma własny folder i własny klucz dostępu.
#  Klucze NIE są w tym pliku (repozytorium jest publiczne). Ustawia się je
#  w panelu Netlify, w zmiennej KLUCZE_MATERIALOW – patrz README, punkt 9.
#
#  Jak dodać grupę?
#   1. Utwórz folder materialy/<id>/ i wgraj do niego pliki.
#   2. Skopiuj blok od „- id:” na dół tego pliku i zmień wartości.
#   3. Dodaj klucz dla tego id w Netlify (KLUCZE_MATERIALOW).
#
#  Pola:
#   id     – nazwa folderu w materialy/: tylko małe litery bez polskich znaków,
#            cyfry i myślniki, np. ocenianie-2026 (wymagane)
#   nazwa  – tytuł pokazywany na stronie (wymagane)
#   opis   – krótki opis pod tytułem (opcjonalne)
#   pliki  – lista plików z ładną nazwą i opisem (opcjonalne). Pliki z folderu,
#            których tu nie ma, też pojawią się na stronie, tylko pod nazwą pliku.
#            Kolejność na stronie: najpierw pliki z tej listy, potem pozostałe.

- id: ocenianie-ksztaltujace
  nazwa: "Ocenianie kształtujące"
  opis: "Materiały z warsztatów dla nauczycieli: prezentacja i karta do pracy z uczniami."
  pliki:
    - plik: prezentacja-ocenianie-ksztaltujace.pdf
      nazwa: "Prezentacja z warsztatów"
      opis: "Slajdy z obu dni szkolenia."
    - plik: karta-informacji-zwrotnej.pdf
      nazwa: "Karta informacji zwrotnej"
      opis: "Szablon do wydrukowania dla uczniów."

- id: czas-do-lasu
  nazwa: "CZASdoLASU – zajęcia w terenie"
  opis: "Scenariusze i pomoce z warsztatów outdoorowych."
  pliki:
    - plik: scenariusze-zajec-w-lesie.pdf
      nazwa: "Scenariusze zajęć w lesie"

- id: mentoring
  nazwa: "Mentoring EduMastermind"
  opis: "Dokumenty dla uczestników programu mentoringowego."
  pliki:
    - plik: kontrakt-mentoringowy.pdf
      nazwa: "Kontrakt mentoringowy"
      opis: "Wzór kontraktu do wypełnienia na pierwszym spotkaniu."
    - plik: arkusz-celow.pdf
      nazwa: "Arkusz celów"
